name: Validate and publish Ruta Sistemas

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "collector/**"
      - ".github/workflows/refresh-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile production CSS
        run: |
          npm ci
          npm run build:css
      - name: Run catalog and state tests
        run: python -m unittest discover -s tests -v
      - name: Validate canonical source and generated snapshot
        run: |
          python scripts/build_catalog.py --check
          python scripts/validate_catalog.py
          python scripts/validate_candidates.py data/candidates/inbox.example.json
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Exercise public catalog filtering
        run: node tests/catalog_ui.test.cjs

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile production CSS
        run: |
          npm ci
          npm run build:css
      - name: Prepare and validate exact Pages artifact
        run: python scripts/pages_artifact.py --output dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
